# Shunt NeusisCode Configuration
# Worker model: Luna (configurable)
#
# NOTE: model_class originally referenced configs.neusis_router_model:NeusisRouterModel,
# which is not part of this standalone repo. For standalone use, instantiate
# shunt_model.ShuntModel directly (see README).

model:
  model_name: codex/gpt-5.6-luna
  model_kwargs:
    api_base: https://pbtest.neusis.ai/router/v1
    api_key: ""  # Set via NEUSIS_API_KEY environment variable

# Shunt configuration
shunt:
  enabled: true
  worker_model: codex/gpt-5.6-luna  # Configurable - change this per task
  threshold: 350  # Lines - files larger than this get intercepted
  api_base: https://pbtest.neusis.ai/router/v1
  api_key: ""  # Set via NEUSIS_API_KEY environment variable

# Agent configuration
agent:
  name: neusiscode
  description: NeusisCode with shunt interception
  tools:
    - name: bash
      description: Execute bash commands
    - name: read
      description: Read file contents
    - name: write
      description: Write file contents
    - name: edit
      description: Edit file contents

# Environment
environment:
  base_dir: /testbed
  python_version: "3.10"
  node_version: "18"

# Execution
execution:
  max_steps: 50
  timeout: 600
  retry_attempts: 3

# Logging
logging:
  level: INFO
  log_shunt_interceptions: true
  log_token_usage: true
